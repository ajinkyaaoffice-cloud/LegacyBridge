[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacybridge"
version = "0.1.0"
description = "Multi-agent legacy code migration (COBOL -> Python) with differential-testing proof of equivalence"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.40",
  "pydantic>=2.6",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
legacybridge = "legacybridge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legacybridge = ["dashboard/static/*", "adapters/cobol_python/*.md", "adapters/cobol_python/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "cobc: requires GnuCOBOL (cobc) on PATH",
  "network: requires real API keys and network",
]
